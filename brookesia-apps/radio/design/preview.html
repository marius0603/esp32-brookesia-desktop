<script>

const icon=name=>'<svg class="icon" viewBox="0 0 32 32" aria-hidden="true">'+shapes[name]+'</svg>';
document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));
const channels=JSON.parse(document.getElementById('radio-catalog').textContent).stations;
let current=0,playing=false,category='儿童',minutes=0,draftMinutes=0;const favorites=new Set();
const byId=id=>document.getElementById(id);
function show(screen){['player','stations','timer'].forEach(s=>byId(s).hidden=s!==screen);if(screen==='stations')renderList();if(screen==='timer'){draftMinutes=minutes;renderTimer();}}
function renderPlayer(){const ch=channels[current];byId('station-name').textContent=ch.display_name||ch.name;byId('station-meta').textContent=ch.group+' · '+ch.sub;byId('play').innerHTML=icon(playing?'pause':'play')+'<span>'+(playing?'暂停':'播放')+'</span>';byId('play').setAttribute('aria-label',playing?'暂停':'播放');byId('player').classList.toggle('playing',playing);byId('stream-status').innerHTML=playing?'<span class="equ" aria-hidden="true"><i></i><i></i><i></i></span>正在播放':'准备播放';byId('stream-status').style.display='inline-flex';byId('stream-status').style.alignItems='center';byId('favorite').classList.toggle('active',favorites.has(current));byId('favorite').setAttribute('aria-pressed',String(favorites.has(current)));byId('favorite').setAttribute('aria-label',favorites.has(current)?'取消收藏当前频道':'收藏当前频道');byId('timer-label').textContent=minutes?minutes+'分钟':'定时';}
function select(index){current=index;playing=true;renderPlayer();show('player');}
function renderList(){document.querySelectorAll('.category').forEach(b=>{b.classList.toggle('active',b.dataset.category===category);b.setAttribute('aria-pressed',String(b.dataset.category===category));});const rows=channels.map((c,i)=>({c,i})).filter(({c,i})=>category==='收藏'?favorites.has(i):c.group===category);byId('station-list').innerHTML=rows.length?rows.map(({c,i})=>'<button class="station-row '+(i===current?'selected':'')+'" data-station="'+i+'"><span class="station-symbol">'+c.symbol+'</span><span class="row-content"><span class="row-name">'+(c.display_name||c.name)+'</span><span class="row-sub" style="display:block">'+c.sub+'</span></span><span class="row-end">'+(i===current?icon('check'):'')+'</span></button>').join(''):'<div class="empty">还没有收藏的频道</div>';byId('station-list').querySelectorAll('[data-station]').forEach(b=>b.onclick=()=>select(Number(b.dataset.station)));}
function renderTimer(){document.querySelectorAll('[data-minutes]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.minutes)===draftMinutes);b.setAttribute('aria-pressed',String(Number(b.dataset.minutes)===draftMinutes));});byId('timer-note').textContent=draftMinutes?draftMinutes+' 分钟后停止播放':'持续收听，不自动停止';}
