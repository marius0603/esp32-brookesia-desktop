<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音助手</title>
<style>body{font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;background:#f3f5f8;color:#172334;margin:0}main{max-width:850px;margin:32px auto;padding:0 20px}section{background:white;border:1px solid #dde5ee;border-radius:18px;padding:24px;margin:20px 0}h1{margin:0}h2{font-size:21px;margin:0 0 12px}p{color:#637184}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c6d2e0;border-radius:9px;font:inherit}textarea{min-height:110px}label{display:block;margin:12px 0 5px}button{font:inherit;border:0;border-radius:9px;padding:10px 20px;background:#245cb4;color:white;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#64748b}audio{width:100%;margin-top:16px}.reply{white-space:pre-wrap;padding:16px;background:#f6f8fc;border-radius:12px;min-height:90px}.status{color:#245cb4}summary{cursor:pointer}a{color:#245cb4}</style>
<main><h1>语音助手</h1><p id="models">正在连接本机服务……</p><section><h2>与助手对话</h2><textarea id="text" placeholder="输入一句话，或点击录音说话……" maxlength="1200"></textarea><button onclick="sendText()">发送</button><button id="record" onclick="record()">开始录音</button><button class="secondary" onclick="stop()">停止回答</button><p class="status" id="status"></p><p id="heard"></p><div class="reply" id="answer">回答会显示在这里，并通过声音播放。</div><audio id="audio" controls></audio></section>
<section><details><summary>云服务与声音设置</summary><label>API 地址</label><input id="url"><label>模型名称</label><input id="model"><label>API 密钥</label><input id="key" type="password" autocomplete="off" placeholder="已配置时留空即可"><label>声音</label><select id="speaker"><option>Serena</option><option>Vivian</option><option>Uncle_Fu</option></select><button onclick="save()">保存设置</button><p id="saved"></p></details></section><p><a href="/">文字朗读与文件转写</a> · 录音在本机识别，转写文字和对话历史发送到已配置的云服务。</p></main>
<script>
const $=x=>document.getElementById(x);let current='',seen=0,queue=[],playing=false,recorder=null,stream=null,recordTimer=null;
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
async function state(){try{const s=await(await fetch('/api/assistant/state')).json();$('models').textContent=s.models_ready?'本机模型已就绪 · 云服务'+(s.config.key_configured?'已配置':'尚未配置'):(s.model_error?'模型准备失败：'+s.model_error:'正在准备本机模型，首次连接需要等待……');if(!$('url').value){$('url').value=s.config.base_url;$('model').value=s.config.model;$('speaker').value=s.config.speaker||'Serena';}}catch(_){$('models').textContent='无法连接本机服务';}setTimeout(state,3000);}state();
async function save(){try{await request('/api/assistant/config',{base_url:$('url').value,model:$('model').value,api_key:$('key').value,speaker:$('speaker').value});$('key').value='';$('saved').textContent='设置已保存';}catch(e){$('saved').textContent=e.message;}}
async function stop(){const id=current;current='';queue=[];playing=false;$('audio').pause();$('audio').removeAttribute('src');if(id)await request('/api/assistant/cancel',{id}).catch(()=>{});$('status').textContent='已停止';}
function play(){if(playing||!queue.length)return;playing=true;$('audio').src=queue.shift();$('audio').play().catch(()=>{$('status').textContent='语音已准备好，点击播放器即可收听';});}
$('audio').onended=()=>{playing=false;play();};
async function submit(body){await stop();try{const job=await request('/api/assistant/chat',body);current=job.id;seen=0;$('answer').textContent='';$('heard').textContent='';$('status').textContent='正在处理……';while(current===job.id){await new Promise(r=>setTimeout(r,700));const s=await(await fetch('/api/assistant/jobs/'+job.id)).json();if(current!==job.id)break;$('heard').textContent=s.user_text?'你：'+s.user_text:'';$('answer').textContent=s.answer||'';$('status').textContent=s.message||'正在处理……';queue.push(...s.audios.slice(seen));seen=s.audios.length;play();if(s.state==='error')throw Error(s.error);if(s.state==='done'){$('status').textContent='回答已生成';break;}if(s.state==='cancelled')break;}}catch(e){$('status').textContent=e.message;}}
function sendText(){const text=$('text').value.trim();if(text)submit({text});}
async function record(){if(recorder&&recorder.state==='recording'){recorder.stop();return;}try{await stop();stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{clearTimeout(recordTimer);stream.getTracks().forEach(t=>t.stop());$('record').textContent='开始录音';const blob=new Blob(chunks,{type:recorder.mimeType});const data=new Uint8Array(await blob.arrayBuffer());let binary='';for(let at=0;at<data.length;at+=32768)binary+=String.fromCharCode(...data.subarray(at,at+32768));submit({audio:btoa(binary),filename:'录音.webm'});};recorder.start();$('record').textContent='结束并发送';$('status').textContent='正在录音，最长30秒';recordTimer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop();},30000);}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());$('status').textContent='无法开始录音：'+e.message;}}
</script></html>
